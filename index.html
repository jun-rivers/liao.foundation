<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIAO Foundation</title>
    <script>
      (function(d) {
        var config = {
          kitId: 'omx6kln',
          scriptTimeout: 3000,
          async: true
        },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElement[...]
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5ff 25%, #fffaf5 50%, #f5fffa 75%, #ffffff 100%);
            font-family: aktiv-grotesk, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
        }

        .logo-section {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .logo {
            max-width: 600px;
            width: 100%;
            height: auto;
            animation: fadeInZoomOut 1.8s ease-out;
        }

        .coming-soon {
            position: absolute;
            top: 75%;
            transform: translateY(-50%);
            width: 100%;
            animation: fadeIn 0.8s ease-out 1.8s both;
        }

        h3 {
            font-size: 1.5rem;
            font-weight: 200;
            color: #333;
            letter-spacing: 0.05em;
        }

        @keyframes fadeInZoomOut {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .logo {
                max-width: 400px;
            }

            h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="assets/logo-type.png" alt="LIAO Foundation Logo" class="logo">
        </div>
        <div class="coming-soon">
            <h3>Coming Soon</h3>
        </div>
    </div>
</body>
</html>
